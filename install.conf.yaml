- defaults:
    link:
      relink: true

- clean: ["~"]

- link:
    ~/.config/nvim: nvim
    ~/.config/zsh: zsh
    ~/.config/tmux: tmux
    ~/.config/sway: sway
    # wayland overlay bar
    ~/.config/wob.ini: sway/other_configs/wob.ini
    ~/.config/foot: foot
    # waybar
    ~/.config/waybar: waybar
    ~/.gitconfig: git/.gitconfig

- shell:
    - command: ~/.config/tmux/plugins/tpm/bin/install_plugins
      description: Installing tmux plugins
